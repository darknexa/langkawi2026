<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅行分账 🏝️</title>
<style>
/* ===== 色彩与基础 ===== */
:root{--bg:#efe6cf;--card:#f8f2e2;--ink:#3d3426;--mut:#9a8d74;--gold:#b8955f;--sage:#6f9474;--rose:#c0796b;--line:#e6dbc0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#d9cfb6;display:flex;justify-content:center;color:var(--ink);font:14px/1.45 -apple-system,"PingFang SC","Noto Sans SC","Segoe UI",sans-serif}
#app{width:100%;max-width:430px;min-height:100vh;background:var(--bg);padding:14px 14px 110px;overflow-x:hidden;position:relative}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(120,95,50,.08)}
h1{font-size:24px;line-height:1.2;margin:0 0 4px}h3{margin:0 0 12px;font-size:16px}
.mut{color:var(--mut);font-size:12px}.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;border:2px solid #fff8}
.avs{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.avs b{display:block;font-size:11px;text-align:center;font-weight:500}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.stats .card{margin:0;padding:14px}
.stats b{display:block;font-size:22px;margin-top:2px}
.tabs{display:flex;background:var(--line);border-radius:16px;padding:4px;margin-bottom:12px}
.tabs div{flex:1;text-align:center;padding:9px 0;border-radius:12px;font-weight:600;color:var(--mut)}
.tabs .on{background:var(--gold);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chip{flex:none;padding:7px 13px;border-radius:99px;background:var(--line);border:1.5px solid transparent;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:#f3e2c0;border-color:var(--gold);font-weight:600}
.bar{height:14px;border-radius:99px;min-width:6px}.bl{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center;margin:9px 0;font-size:13px}
.tag{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--line)}
.pos{color:var(--sage)}.neg{color:var(--rose)}.pos.tag{background:#dfe9d8}.neg.tag{background:#f3dcd5}
.it{display:flex;gap:10px;align-items:flex-start}.ic{width:42px;height:42px;border-radius:14px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.sh{font-size:11.5px;color:var(--mut);margin-top:4px;word-break:break-word}
.tx{display:flex;align-items:center;gap:8px;background:var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.tx b{color:var(--gold)}
.btn{border:0;background:var(--gold);color:#fff;font-weight:700;border-radius:16px;padding:12px 18px;font-size:15px}
.btn.ghost{background:var(--line);color:var(--ink)}.btn.s{padding:7px 12px;font-size:12px;border-radius:12px}
#fab{position:fixed;right:max(16px,calc(50% - 199px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--gold);color:#fff;font-size:32px;border:0;box-shadow:0 6px 16px rgba(120,90,40,.35);z-index:5}
#mask{position:fixed;inset:0;background:#3d34269a;display:none;z-index:10}#mask.on{display:block}
#dr{position:fixed;left:50%;bottom:0;width:100%;max-width:430px;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));z-index:11;transform:translate(-50%,105%);transition:transform .25s}
#dr.on{transform:translate(-50%,0)}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 6px}
input[type=text],input[type=number],textarea{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:11px 13px;font:inherit;color:var(--ink)}
.big{font-size:30px!important;font-weight:700;text-align:center}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#3d3426;color:#fff;padding:9px 16px;border-radius:99px;z-index:30;display:none;font-size:13px}
#img{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:40}#img img{max-width:94%;max-height:90%;border-radius:12px}
.th{width:44px;height:44px;border-radius:10px;object-fit:cover;margin-top:6px}
</style>
</head>
<body>
<div id="app"></div>

<div id="mask" onclick="closeD()"></div><div id="dr"></div><div id="toast"></div>
<div id="img" onclick="this.style.display='none'"><img></div>
