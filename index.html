<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅行分账 🏝️</title>
<style>
/* ===== 色彩与基础 ===== */
:root{--bg:#efe6cf;--card:#f8f2e2;--ink:#3d3426;--mut:#9a8d74;--gold:#b8955f;--sage:#6f9474;--rose:#c0796b;--line:#e6dbc0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#d9cfb6;display:flex;justify-content:center;color:var(--ink);font:14px/1.45 -apple-system,"PingFang SC","Noto Sans SC","Segoe UI",sans-serif}
#app{width:100%;max-width:430px;min-height:100vh;background:var(--bg);padding:14px 14px 110px;overflow-x:hidden;position:relative}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(120,95,50,.08)}
h1{font-size:24px;line-height:1.2;margin:0 0 4px}h3{margin:0 0 12px;font-size:16px}
.mut{color:var(--mut);font-size:12px}.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;border:2px solid #fff8}
.avs{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.avs b{display:block;font-size:11px;text-align:center;font-weight:500}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.stats .card{margin:0;padding:14px}
.stats b{display:block;font-size:22px;margin-top:2px}
.tabs{display:flex;background:var(--line);border-radius:16px;padding:4px;margin-bottom:12px}
.tabs div{flex:1;text-align:center;padding:9px 0;border-radius:12px;font-weight:600;color:var(--mut)}
.tabs .on{background:var(--gold);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chip{flex:none;padding:7px 13px;border-radius:99px;background:var(--line);border:1.5px solid transparent;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:#f3e2c0;border-color:var(--gold);font-weight:600}
.bar{height:14px;border-radius:99px;min-width:6px}.bl{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center;margin:9px 0;font-size:13px}
.tag{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--line)}
.pos{color:var(--sage)}.neg{color:var(--rose)}.pos.tag{background:#dfe9d8}.neg.tag{background:#f3dcd5}
.it{display:flex;gap:10px;align-items:flex-start}.ic{width:42px;height:42px;border-radius:14px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.sh{font-size:11.5px;color:var(--mut);margin-top:4px;word-break:break-word}
.tx{display:flex;align-items:center;gap:8px;background:var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.tx b{color:var(--gold)}
.btn{border:0;background:var(--gold);color:#fff;font-weight:700;border-radius:16px;padding:12px 18px;font-size:15px}
.btn.ghost{background:var(--line);color:var(--ink)}.btn.s{padding:7px 12px;font-size:12px;border-radius:12px}
#fab{position:fixed;right:max(16px,calc(50% - 199px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--gold);color:#fff;font-size:32px;border:0;box-shadow:0 6px 16px rgba(120,90,40,.35);z-index:5}
#mask{position:fixed;inset:0;background:#3d34269a;display:none;z-index:10}#mask.on{display:block}
#dr{position:fixed;left:50%;bottom:0;width:100%;max-width:430px;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));z-index:11;transform:translate(-50%,105%);transition:transform .25s}
#dr.on{transform:translate(-50%,0)}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 6px}
input[type=text],input[type=number],textarea{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:11px 13px;font:inherit;color:var(--ink)}
.big{font-size:30px!important;font-weight:700;text-align:center}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#3d3426;color:#fff;padding:9px 16px;border-radius:99px;z-index:30;display:none;font-size:13px}
#img{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:40}#img img{max-width:94%;max-height:90%;border-radius:12px}
.th{width:44px;height:44px;border-radius:10px;object-fit:cover;margin-top:6px}
</style>
</head>
<body>
<div id="app"></div>
<button id="fab" onclick="openD()">+</button>
<div id="mask" onclick="closeD()"></div><div id="dr"></div><div id="toast"></div>
<div id="img" onclick="this.style.display='none'"><img></div>

<script>
/* ===== 配置：部署前请填写 =====
 FB    : Firebase Realtime Database 网址，如 https://xxx-default-rtdb.firebaseio.com （留空 = 本地测试模式，人人都是 Admin）
 KEY   : Admin 密钥。Admin 链接 = 网址?key=密钥 ；Viewer 链接 = 不带 key 的网址
 CLOUD / PRESET : Cloudinary 的 cloud name 与 unsigned upload preset（留空则无法上传小票）*/
const CFG={FB:'https://langkawi-2026-default-rtdb.asia-southeast1.firebasedatabase.app',KEY:'lk2026-mimi8',CLOUD:'',PRESET:''};
const ADMIN=!CFG.FB||new URLSearchParams(location.search).get('key')===CFG.KEY;
if(!ADMIN)document.getElementById('fab').remove();

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=[['food','🍜','餐饮'],['transport','🚗','交通'],['hotel','🏨','住宿'],['act','🎟','门票'],['shop','🛍','购物'],['other','📦','其他']];
const PAYS=[['TNG','💙 TNG'],['Bank','🏦 Bank'],['Cash','💵 Cash']];
const COL=['#b8955f','#8fae94','#a99bbd','#7f9f9c','#d0a09a','#c9b88a'];
const rm=c=>(c/100).toFixed(2);          // 分 → "12.34"
const cat=k=>CATS.find(c=>c[0]===k)||CATS[5];

/* ===== 数据（金额全部以“分”为整数，避免浮点误差）===== */
let S=JSON.parse(localStorage.tripS||'null')||{name:'Langkawi Trip 2026',date:'9 Oct – 12 Oct',
 m:[1,2,3,4,5].map(i=>({id:'m'+(i-1),name:'成员'+i,e:''})),pool:[],exp:[]};
let T=0,F='all',P=0,D=null;
const fix=()=>{S.pool=S.pool||[];S.exp=S.exp||[];S.exp.forEach(e=>{e.ex=e.ex||[]})};
async function load(){if(!CFG.FB)return;try{const r=await(await fetch(CFG.FB+'/trip.json')).json();if(r){S=r;fix();localStorage.tripS=JSON.stringify(S);if(!D)R()}}catch(e){}}
async function save(){localStorage.tripS=JSON.stringify(S);if(CFG.FB)try{await fetch(CFG.FB+'/trip.json',{method:'PUT',body:JSON.stringify(S)})}catch(e){toast('同步失败，请检查网络')}R()}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}

/* ===== 可爱插画头像（SVG），也可在编辑成员时改成 Emoji ===== */
const SK=['#f6d5b8','#f0c3a0','#e8b690'],HR=['#4a3426','#7a4b2a','#2f2a30','#a2603a','#d98aa0'],BG=['#f3d6cf','#d6e5d3','#e2d9ee','#f6e6b8','#cfe3e6'];
function av(i,sz=44){const m=S.m[i],k=i%5;
 if(m.e)return `<span class="av" style="width:${sz}px;height:${sz}px;font-size:${sz*.55}px;background:${BG[k]}">${esc(m.e)}</span>`;
 const h=HR[k],back=[`<rect x="9" y="14" width="30" height="28" rx="12" fill="${h}"/>`,`<circle cx="24" cy="23" r="15" fill="${h}"/>`,`<circle cx="11" cy="13" r="5.5" fill="${h}"/><circle cx="37" cy="13" r="5.5" fill="${h}"/>`][k%3];
 return `<svg class="av" width="${sz}" height="${sz}" viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="${BG[k]}"/>${back}<circle cx="24" cy="26" r="11" fill="${SK[i%3]}"/><path d="M12.5 25c0-10 23-10 23 0c-6-3.5-17-3.5-23 0z" fill="${h}"/><circle cx="20" cy="27.5" r="1.3" fill="#3d3426"/><circle cx="28" cy="27.5" r="1.3" fill="#3d3426"/><path d="M21 31q3 2.6 6 0" stroke="#c0796b" fill="none" stroke-width="1.3" stroke-linecap="round"/><circle cx="16.5" cy="30.5" r="2" fill="#f4a8a0" opacity=".55"/><circle cx="31.5" cy="30.5" r="2" fill="#f4a8a0" opacity=".55"/></svg>`}
const mi=id=>S.m.findIndex(m=>m.id===id),nm=id=>S.m[mi(id)]?.name||'?';

/* ===== 核心算法 1：除不尽的尾差公平分配 =====
 基础金额向下取整到分；剩余 n 分给“累计多付次数最少”的人（并列按成员顺序），并把多付者记入 e.ex，供下次公平轮流 */
function extraCnt(skipId){const o={};S.m.forEach(m=>o[m.id]=0);S.exp.forEach(e=>e.id!==skipId&&(e.ex||[]).forEach(k=>o[k]++));return o}
function split(c,parts,skipId){const n=parts.length,b=Math.floor(c/n),rem=c-b*n,o=extraCnt(skipId);
 const order=[...parts].sort((a,z)=>o[a]-o[z]||mi(a)-mi(z)),ex=order.slice(0,rem),sh={};
 parts.forEach(k=>sh[k]=b+(ex.includes(k)?1:0));return{sh,ex}}

/* ===== 核心算法 2：结算 =====
 net = 个人垫付 + 交入公款 − 应分摊；公款剩余按出资比例退还；最后保证总和为 0 */
function calc(){const r={};S.m.forEach(m=>r[m.id]={paid:0,owed:0,con:0});let tot=0,pu=0,pc=0;
 S.exp.forEach(e=>{tot+=e.c;if(e.p==='pool')pu+=e.c;else if(r[e.p])r[e.p].paid+=e.c;for(const k in e.sh)if(r[k])r[k].owed+=e.sh[k]});
 S.pool.forEach(p=>{if(r[p.m])r[p.m].con+=p.c;pc+=p.c});
 const bal=pc-pu;S.m.forEach(m=>{const x=r[m.id];x.net=x.paid+x.con-x.owed});
 if(pc>0){let sum=0,big=S.m[0].id;S.m.forEach(m=>{const x=r[m.id];x.net-=Math.round(bal*x.con/pc);sum+=x.net;if(x.con>r[big].con)big=m.id});r[big].net-=sum}
 return{r,tot,bal}}
/* 核心算法 3：最少转账对（贪心：最大欠款人 → 最大应收人）*/
function txs(r){const c=[],d=[];S.m.forEach(m=>{const v=r[m.id].net;v>0?c.push([m.id,v]):v<0&&d.push([m.id,-v])});const out=[];
 while(c.length&&d.length){c.sort((a,b)=>b[1]-a[1]);d.sort((a,b)=>b[1]-a[1]);const t=Math.min(c[0][1],d[0][1]);out.push([d[0][0],c[0][0],t]);c[0][1]-=t;d[0][1]-=t;if(!c[0][1])c.shift();if(!d[0][1])d.shift()}return out}

/* ===== 页面渲染 ===== */
const net=v=>`<span class="tag ${v>=0?'pos':'neg'}">${v>=0?'+':'−'}RM ${rm(Math.abs(v))}</span>`;
function exCard(e,pid){const c=cat(e.cat),n=Object.keys(e.sh).length,me=pid!=null?S.m[pid].id:null;
 const who=e.p==='pool'?'🏖️ 公账':nm(e.p)+' 垫付',how=e.mode==='cu'?'每人不同':'均摊 '+n+' 人';
 const sub=c[2]+' · '+how+' · '+who;
 return `<div class="card" onclick="showE('${e.id}')"><div class="it"><div class="ic">${c[1]}</div><div class="sp"><div class="row"><b class="sp">${esc(e.name)}${e.img?' 📎':''}</b><b>RM ${rm(e.c)}</b></div><div class="mut">${sub} · ${e.pay}</div></div></div></div>`}

/* 单笔详情：点列表进入，逐人显示分摊 */
function showE(id){const e=S.exp.find(x=>x.id===id);if(!e)return;const ks=Object.keys(e.sh),n=ks.length;
 $('#dr').innerHTML=`<div style="text-align:center"><div class="ic" style="margin:0 auto 8px;width:64px;height:64px;font-size:30px">${cat(e.cat)[1]}</div><b>${esc(e.name)}</b><div style="font-size:34px;font-weight:700;margin:4px 0">RM ${rm(e.c)}</div><div class="mut">${cat(e.cat)[2]} · ${e.p==='pool'?'🏖️ 旅行公账':esc(nm(e.p))+' 垫付'} · ${e.pay} · ${e.mode==='cu'?'每人不同':'均摊'}</div></div>${e.img?`<img src="${esc(e.img)}" style="width:100%;max-height:220px;object-fit:cover;border-radius:16px;margin-top:14px" onclick="viewImg('${esc(e.img)}')"><div class="mut" style="text-align:center;font-size:11px">小票 · 点击查看大图</div>`:''}
 <label>分摊明细</label><div class="card" style="padding:2px 14px">${ks.map(k=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)">${av(mi(k),30)}<b class="sp">${esc(nm(k))}</b><b>RM ${rm(e.sh[k])}</b></div>`).join('')}</div>
 ${e.mode!=='cu'&&e.c%n?'<div class="mut" style="text-align:center;font-size:11px">零头已轮流分配</div>':''}
 ${e.note?`<div class="sh">📝 ${esc(e.note)}</div>`:''}
 ${ADMIN?`<div class="row" style="justify-content:center;gap:28px;margin:14px 0"><span class="neg" onclick="D={id:'${e.id}'};del()">删除此条</span><span style="color:var(--gold)" onclick="dup('${e.id}')">复制一条</span></div>`:''}
 <div class="row" style="margin-top:12px"><button class="btn ghost sp" onclick="closeD()">返回</button>${ADMIN?`<button class="btn sp" onclick="openD('${e.id}')">修改</button>`:''}</div>`;
 $('#mask').classList.add('on');$('#dr').classList.add('on')}
function dup(id){openD(id);delete D.id;drawD()}

/* 个人小票：只列自己参与的项目，页面内查看，不导出 */
function receipt(){const {r}=calc(),m=S.m[P],x=r[m.id],mine=S.exp.filter(e=>e.sh[m.id]!=null),d=new Date(),n=x.net;
 const zz=(id,p)=>`<svg width="100%" height="8" style="display:block"><defs><pattern id="${id}" width="12" height="8" patternUnits="userSpaceOnUse"><path d="${p}" fill="#fffdf6"/></pattern></defs><rect width="100%" height="8" fill="url(#${id})"/></svg>`;
 const ln='<div style="border-top:1px dashed #cdbf9d;margin:10px 0"></div>',rw=(a,b,s='')=>`<div class="row" style="${s}"><span class="sp">${a}</span><span>${b}</span></div>`;
 const to=txs(r).filter(t=>t[n<0?0:1]===m.id).map(t=>n<0?`请转 RM ${rm(t[2])} 给 ${esc(nm(t[1]))}`:`${esc(nm(t[0]))} 将转 RM ${rm(t[2])} 给你`).join('<br>');
 $('#dr').innerHTML=`${zz('z1','M0 8L6 0L12 8Z')}<div style="font:13px/1.6 ui-monospace,Menlo,monospace;background:#fffdf6;padding:6px 16px 14px">
 <div style="text-align:center"><b style="font-size:16px">${esc(S.name)}</b><br><b>${esc(m.name)}</b><br><span class="mut">${d.toLocaleDateString('en-GB')} ${d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</span></div>${ln}
 ${mine.map(e=>rw(esc(e.name)+` <span class="mut">(${e.mode==='cu'?'每人不同':'平摊 '+Object.keys(e.sh).length+' 人'})</span>`,'RM '+rm(e.sh[m.id]))).join('')||'<div class="mut">暂无参与项目</div>'}${ln}
 ${rw('已垫付','RM '+rm(x.paid))}${rw('已交公款','RM '+rm(x.con))}${rw('应分摊','RM '+rm(x.owed))}${ln}
 <div class="row" style="font-size:19px;font-weight:700"><span class="sp">${n<0?'最终需补':'最终应收'}</span><span class="${n<0?'neg':'pos'}">RM ${rm(Math.abs(n))}</span></div>
 ${to?`<div class="mut" style="margin-top:8px">${to}</div>`:''}</div>${zz('z2','M0 0L6 8L12 0Z')}
 <button class="btn ghost" style="width:100%;margin-top:16px" onclick="closeD()">返回</button>`;
 $('#mask').classList.add('on');$('#dr').classList.add('on')}
function R(){const {r,tot,bal}=calc();let h=`<div class="card"><div class="row"><div class="sp"><h1 ${ADMIN?'onclick="editTrip()"':''}>${esc(S.name)}</h1><div class="mut">${esc(S.date)}${ADMIN?'':' · 只读'}</div></div></div>
 <div class="avs">${S.m.map((m,i)=>`<div ${ADMIN?`onclick="editM(${i})"`:''}>${av(i,46)}<b>${esc(m.name)}</b></div>`).join('')}</div></div>
 <div class="stats"><div class="card"><span class="mut">总消费</span><b>RM ${rm(tot)}</b></div><div class="card"><span class="mut">🏖️ 公款剩余</span><b class="${bal<0?'neg':'pos'}">RM ${rm(bal)}</b></div></div>
 <div class="tabs">${['概览','明细','个人账单'].map((t,i)=>`<div class="${T===i?'on':''}" onclick="T=${i};R()">${t}</div>`).join('')}</div>`;
 if(T===0){
  const sums=CATS.map(c=>[c,S.exp.filter(e=>e.cat===c[0]).reduce((a,e)=>a+e.c,0)]),mx=Math.max(1,...sums.map(s=>s[1]));
  h+=`<div class="card"><h3>分类消费</h3>${sums.map((s,i)=>`<div class="bl"><span>${s[0][1]} ${s[0][2]}</span><div class="row"><div class="bar" style="width:${s[1]/mx*100*.62}%;background:${COL[i]}"></div><span class="mut">${rm(s[1])}</span></div></div>`).join('')}</div>
  <div class="card"><h3>结账汇总</h3><div class="mut" style="margin:-8px 0 10px">正数 = 应收，负数 = 应付；公款余额按出资比例退还</div>${S.m.map((m,i)=>{const x=r[m.id];return `<div class="row" style="margin-bottom:12px">${av(i,40)}<div class="sp"><b>${esc(m.name)}</b><div class="mut">代付 ${rm(x.paid)} · 应摊 ${rm(x.owed)} · 公款 ${rm(x.con)}</div></div>${net(x.net)}</div>`}).join('')}</div>
  <div class="card"><h3>转账建议</h3>${txs(r).map(t=>`<div class="tx">${av(mi(t[0]),32)}<span class="sp">${esc(nm(t[0]))} → ${esc(nm(t[1]))}</span><b>RM ${rm(t[2])}</b></div>`).join('')||'<div class="mut">暂无需要转账的款项 🎉</div>'}</div>
  <div class="card"><div class="row"><h3 class="sp" style="margin:0">公款记录</h3>${ADMIN?'<button class="btn s" onclick="collect()">收公款</button>':''}</div><div style="margin-top:10px"><div class="mut" style="margin-bottom:10px">共收 RM ${rm(S.pool.reduce((a,p)=>a+p.c,0))}</div>${S.pool.map(p=>`<div class="row" style="margin-bottom:8px">${av(mi(p.m),30)}<span class="sp">${esc(nm(p.m))} <span class="mut">已交公款</span></span><b>RM ${rm(p.c)}</b>${ADMIN?`<span class="neg" style="font-size:12px" onclick="delPool('${p.id}')">删除</span>`:''}</div>`).join('')||'<div class="mut">还没有收公款</div>'}</div></div>`;
 }else if(T===1){
  h+=`<div class="chips"><div class="chip ${F==='all'?'on':''}" onclick="F='all';R()">全部</div>${CATS.map(c=>`<div class="chip ${F===c[0]?'on':''}" onclick="F='${c[0]}';R()">${c[1]} ${c[2]}</div>`).join('')}</div>`;
  h+=S.exp.filter(e=>F==='all'||e.cat===F).slice().reverse().map(e=>exCard(e)).join('')||'<div class="card mut" style="text-align:center">还没有消费，点右下角 + 记一笔吧</div>';
 }else{
  const x=r[S.m[P].id],mine=S.exp.filter(e=>e.p===S.m[P].id||e.sh[S.m[P].id]!=null).reverse();
  h+=`<div class="chips" style="flex-wrap:wrap">${S.m.map((m,i)=>`<div class="chip ${P===i?'on':''}" onclick="P=${i};R()">${av(i,26)} ${esc(m.name)}</div>`).join('')}</div>
  <div id="bill"><div class="card"><div class="row">${av(P,52)}<div class="sp"><b style="font-size:17px">${esc(S.m[P].name)} 的账单</b><div class="mut">已交公款 RM ${rm(x.con)}</div></div>${net(x.net)}</div>
  <div class="stats" style="margin:12px 0 0"><div class="card" style="background:var(--bg)"><span class="mut">已垫付</span><b>${rm(x.paid)}</b></div><div class="card" style="background:var(--bg)"><span class="mut">应分摊</span><b>${rm(x.owed)}</b></div></div></div>
  <div class="mut" style="margin:0 4px 8px">共 ${mine.length} 笔</div><div class="card" style="padding:2px 14px">${mine.map(e=>{const id=S.m[P].id,v=e.sh[id];return `<div class="row" style="padding:11px 0;border-bottom:1px solid var(--line)" onclick="showE('${e.id}')"><span style="font-size:20px">${cat(e.cat)[1]}</span><span class="sp"><b>${esc(e.name)}</b>${e.p===id?' <span class="tag">垫付</span>':''}${e.img?' 📎':''}<div class="mut" style="font-size:11px">${cat(e.cat)[2]}</div></span><b>${v!=null?'RM '+rm(v):'代付'}</b></div>`}).join('')||'<div class="mut" style="padding:12px 0">暂无记录</div>'}</div></div>
  <button class="btn" style="width:100%" onclick="receipt()">🧾 查看账单小票</button>`;
 }
 $('#app').innerHTML=h}

function viewImg(u){const o=$('#img');o.querySelector('img').src=u;o.style.display='flex'}

/* ===== 管理操作（仅 Admin）===== */
function editTrip(){const n=prompt('旅行名称',S.name);if(n===null)return;const d=prompt('日期',S.date);S.name=n||S.name;S.date=d||S.date;save()}
function editM(i){const n=prompt('成员名字',S.m[i].name);if(n===null)return;const e=prompt('头像 Emoji（留空 = 可爱插画头像）',S.m[i].e||'');S.m[i].name=n||S.m[i].name;S.m[i].e=(e||'').trim();save()}
function collect(){D={pool:1,v:{}};drawP();$('#mask').classList.add('on');$('#dr').classList.add('on')}
function drawP(){$('#dr').innerHTML=`<h3>收公款 🏖️</h3><label>每人同一金额？填一个数，点「应用」快速填入</label>
 <div class="row"><input type="number" inputmode="decimal" id="pa" placeholder="例：200"><button class="btn ghost s" style="flex:none" onclick="const v=$('#pa').value;S.m.forEach(m=>D.v[m.id]=v);drawP()">应用</button></div>
 <label>每人实际交款（RM，留空 = 没交）</label>${S.m.map((m,i)=>`<div class="row" style="margin-bottom:8px">${av(i,28)}<span class="sp">${esc(m.name)}</span><input type="number" inputmode="decimal" style="width:120px" placeholder="0.00" value="${esc(D.v[m.id]||'')}" oninput="D.v['${m.id}']=this.value"></div>`).join('')}
 <div class="row" style="margin-top:16px"><button class="btn ghost" onclick="closeD()">返回</button><button class="btn sp" onclick="savePool()">保存</button></div>`}
function savePool(){const t=Date.now();let n=0;for(const k in D.v){const c=cents(D.v[k]);if(c>0){S.pool.push({id:t+'_'+k,m:k,c});n++}}if(!n)return toast('请至少填一位成员的金额');closeD();save()}
function delPool(id){if(confirm('删除这条公款记录？')){S.pool=S.pool.filter(p=>p.id!==id);save()}}

/* ===== 新增 / 编辑消费抽屉 ===== */
function openD(id){const e=id&&S.exp.find(x=>x.id===id);
 D=e?{id:e.id,amt:rm(e.c),name:e.name,cat:e.cat,p:e.p,pay:e.pay,mode:e.mode||'eq',parts:Object.keys(e.sh),cu:Object.fromEntries(Object.keys(e.sh).map(k=>[k,rm(e.sh[k])])),note:e.note||'',img:e.img||''}:{amt:'',name:'',cat:'food',p:'pool',pay:'TNG',mode:'eq',parts:S.m.map(m=>m.id),cu:{},note:'',img:''};
 drawD();$('#mask').classList.add('on');$('#dr').classList.add('on')}
function closeD(){D=null;$('#mask').classList.remove('on');$('#dr').classList.remove('on')}
const cents=v=>Math.round((parseFloat(v)||0)*100);
function pvOf(){const c=cents(D.amt),n=D.parts.length;if(!(c>0))return '--';
 if(D.mode==='eq')return n?`每人约 RM ${rm(Math.round(c/n))}`:'请选择参与成员';
 const d=c-Object.values(D.cu).reduce((a,v)=>a+cents(v),0);return d===0?'已分完 ✓':d>0?`还差 RM ${rm(d)}`:`超出 RM ${rm(-d)}`}
const pvU=()=>$('#pv').textContent=pvOf();
function drawD(){$('#dr').innerHTML=`<h3>${D.id?'编辑消费':'记一笔 ✨'}</h3>
 <label>金额 (RM)</label><input class="big" type="number" inputmode="decimal" placeholder="0.00" value="${esc(D.amt)}" oninput="D.amt=this.value;pvU()">
 <label>消费名称</label><input type="text" placeholder="例：海鲜晚餐" value="${esc(D.name)}" oninput="D.name=this.value">
 <label>分类</label><div class="chips" style="flex-wrap:wrap">${CATS.map(k=>`<div class="chip ${D.cat===k[0]?'on':''}" onclick="D.cat='${k[0]}';drawD()">${k[1]} ${k[2]}</div>`).join('')}</div>
 <label>谁付的款</label><div class="chips" style="flex-wrap:wrap"><div class="chip ${D.p==='pool'?'on':''}" onclick="D.p='pool';drawD()">🏖️ 旅行公账</div>${S.m.map(m=>`<div class="chip ${D.p===m.id?'on':''}" onclick="D.p='${m.id}';drawD()">${esc(m.name)} 垫付</div>`).join('')}</div>
 <label>支付方式</label><div class="chips">${PAYS.map(k=>`<div class="chip ${D.pay===k[0]?'on':''}" onclick="D.pay='${k[0]}';drawD()">${k[1]}</div>`).join('')}</div>
 <label>分摊方式</label><div class="chips">${[['eq','均摊'],['cu','每人不同']].map(k=>`<div class="chip ${D.mode===k[0]?'on':''}" onclick="D.mode='${k[0]}';drawD()">${k[1]}</div>`).join('')}</div>
 ${D.mode==='eq'?`<label>参与分账（可取消勾选）　<span style="color:var(--gold)" onclick="D.parts=D.parts.length===S.m.length?[]:S.m.map(m=>m.id);drawD()">全选/清空</span></label>
 <div class="chips" style="flex-wrap:wrap">${S.m.map((m,i)=>`<div class="chip ${D.parts.includes(m.id)?'on':''}" onclick="tg('${m.id}')">${av(i,24)} ${esc(m.name)}</div>`).join('')}</div>`
 :`<label>填每人金额（留空 = 不参与）</label>${S.m.map((m,i)=>`<div class="row" style="margin-bottom:8px">${av(i,28)}<span class="sp">${esc(m.name)}</span><input type="number" inputmode="decimal" style="width:110px" placeholder="0.00" value="${esc(D.cu[m.id]||'')}" oninput="D.cu['${m.id}']=this.value;pvU()"></div>`).join('')}`}
 <div class="card" style="margin:8px 0 0;padding:12px"><b id="pv">${pvOf()}</b></div>
 <label>小票照片</label><div class="row"><label class="btn ghost s" style="margin:0">📷 上传<input type="file" accept="image/*" hidden onchange="upl(this.files[0])"></label>${D.img?`<img class="th" style="margin:0" src="${esc(D.img)}" onclick="viewImg('${esc(D.img)}')">`:'<span class="mut">可选</span>'}</div>
 <label>备注</label><textarea rows="2" oninput="D.note=this.value">${esc(D.note)}</textarea>
 <div class="row" style="margin-top:16px"><button class="btn ghost" onclick="closeD()">返回</button><button class="btn sp" onclick="saveE()">保存</button></div>`}
function tg(id){D.parts=D.parts.includes(id)?D.parts.filter(x=>x!==id):[...D.parts,id];drawD()}
async function upl(f){if(!f)return;if(!CFG.CLOUD)return toast('请先在代码里配置 Cloudinary');toast('上传中…');
 const fd=new FormData();fd.append('file',f);fd.append('upload_preset',CFG.PRESET);
 try{const r=await(await fetch(`https://api.cloudinary.com/v1_1/${CFG.CLOUD}/image/upload`,{method:'POST',body:fd})).json();D.img=r.secure_url;drawD()}catch(e){toast('上传失败')}}
function saveE(){const c=cents(D.amt);if(!(c>0))return toast('请输入金额');const id=D.id||'e'+Date.now();let sh={},ex=[];
 if(D.mode==='cu'){for(const k in D.cu){const v=cents(D.cu[k]);if(v>0)sh[k]=v}
  if(!Object.keys(sh).length)return toast('请填写成员金额');if(Object.values(sh).reduce((a,b)=>a+b,0)!==c)return toast('每人金额加起来要等于总额')}
 else{if(!D.parts.length)return toast('至少选一位参与成员');({sh,ex}=split(c,D.parts,id))}
 const e={id,name:D.name.trim()||cat(D.cat)[2],c,cat:D.cat,p:D.p,pay:D.pay,mode:D.mode,sh,ex,note:D.note.trim(),img:D.img};
 const i=S.exp.findIndex(x=>x.id===id);i>=0?S.exp[i]=e:S.exp.push(e);
 /* 按时间顺序重算均摊账目的尾差，保证全局轮流公平 */
 S.exp.forEach(x=>{if(x.mode!=='cu'){const q=split(x.c,Object.keys(x.sh),x.id);x.sh=q.sh;x.ex=q.ex}});
 closeD();save()}
function del(){if(confirm('确定删除这笔消费？')){S.exp=S.exp.filter(x=>x.id!==D.id);closeD();save()}}

fix();R();load();setInterval(load,10000);
</script>
</body>
